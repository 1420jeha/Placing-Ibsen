const PHASE_NAMES = { 1: 'Norden & Europa', 2: 'Norge', 3: 'Norden, Europa & Nord-Afrika', 4: 'Norden' };

function computeBounds(pts) {
  const lats = pts.map(p => p.lat), lons = pts.map(p => p.lon);
  return L.latLngBounds([Math.min(...lats), Math.min(...lons)], [Math.max(...lats), Math.max(...lons)]);
}
const PHASE_BOUNDS = {};
[1, 2, 3, 4].forEach(ph => {
  const pts = LOCATIONS.filter(l => l.phase === ph);
  PHASE_BOUNDS[ph] = computeBounds(pts);
});

const map = L.map('map', { zoomControl: true, attributionControl: true, scrollWheelZoom: true });
map.fitBounds(PHASE_BOUNDS[1], { padding: [30, 30] });

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap',
  maxZoom: 18
}).addTo(map);

function makeIcon(type) {
  const size = type === 'current' ? 13 : type === 'past' ? 7 : 10;
  const color = type === 'current' ? '#e8c880' : type === 'past' ? '#8a6a3a' : '#c9a96e';
  const border = type === 'current' ? '#fff' : type === 'past' ? '#4a3818' : '#e8c880';
  const shadow = type === 'current' ? '0 0 12px rgba(232,200,128,.9),0 0 28px rgba(232,200,128,.4)' : type === 'past' ? '0 0 5px rgba(0,0,0,.7)' : '0 0 8px rgba(201,169,110,.5)';
  return L.divIcon({
    html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid ${border};box-shadow:${shadow};transition:all .3s"></div>`,
    className: '', iconAnchor: [size/2, size/2], iconSize: [size, size]
  });
}

let markers = [];
let tailSegments = [];
const TAIL_LENGTH = 14;   // how many recent hops stay visible before fading out completely
const TAIL_COLOR = '#c9a96e';
const TAIL_MAX_OPACITY = 0.6;
let showTrail = true;
let currentIdx = 0;
let currentPhase = 1;
let playing = true;
let animTimer = null;

function getSpeedMs() {
  const v = parseInt(document.getElementById('speed').value);
  return Math.round(1990 / v); // default slider (4) plays all 201 stops in ~100s
}

function formatDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  const months = ['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
  return `${parseInt(day)}. ${months[parseInt(m)-1]} ${y}`;
}

// A short, fading "comet tail" behind the current marker instead of one
// permanently accumulating line — so places Ibsen revisited many times
// (Christiania, Munich, Rome...) never end up buried under overlapping
// strokes. TAIL_LENGTH hops stay on screen at once, each older hop fainter
// than the last, and the oldest one fades out completely.
function updateTail(idx) {
  for (let k = 0; k < TAIL_LENGTH; k++) {
    const segIdx = idx - k; // segment runs from LOCATIONS[segIdx-1] to LOCATIONS[segIdx]
    const seg = tailSegments[k];
    if (!showTrail || segIdx <= 0) {
      seg.setLatLngs([]);
      continue;
    }
    const a = LOCATIONS[segIdx - 1], b = LOCATIONS[segIdx];
    seg.setLatLngs([[a.lat, a.lon], [b.lat, b.lon]]);
    const fade = 1 - k / TAIL_LENGTH; // 1 = newest hop, ~0 = about to vanish
    seg.setStyle({ opacity: TAIL_MAX_OPACITY * fade * fade });
  }
}

function maybeChangePhase(idx) {
  const phase = LOCATIONS[idx].phase;
  if (phase !== currentPhase) {
    currentPhase = phase;
    map.flyToBounds(PHASE_BOUNDS[phase], { padding: [30, 30], duration: 2.2 });
    document.getElementById('phase-label').textContent = PHASE_NAMES[phase];
  }
}

function updateMap(idx) {
  const loc = LOCATIONS[idx];

  markers.forEach((m, i) => {
    const type = i === idx ? 'current' : i < idx ? 'past' : 'future';
    if (type === 'future') {
      m.setOpacity(0);
    } else {
      m.setOpacity(1);
      m.setIcon(makeIcon(type));
    }
  });

  updateTail(idx);

  document.getElementById('year-num').textContent = loc.start.slice(0, 4);
  document.getElementById('phase-label').textContent = PHASE_NAMES[loc.phase];
  document.getElementById('timeline').value = idx;
  document.querySelector('#counter').textContent = `Lokasjon ${idx + 1} av ${LOCATIONS.length}`;

  const panel = document.getElementById('info-content');
  const visible = LOCATIONS.slice(Math.max(0, idx - 4), idx + 1).reverse();
  panel.innerHTML = visible.map((l, i) => `
    <div class="info-entry" style="opacity:${i === 0 ? 1 : Math.max(0.3, 1 - i * 0.18)}">
      <div class="info-date">${formatDate(l.start)}</div>
      <div class="info-place">${l.label}</div>
      ${l.address && l.address !== l.label ? `<div class="info-addr">${l.address}</div>` : ''}
    </div>`).join('');
}

function initMarkers() {
  LOCATIONS.forEach((loc, i) => {
    const m = L.marker([loc.lat, loc.lon], { icon: makeIcon('future'), opacity: 0 })
      .addTo(map)
      .on('click', () => {
        stopAnimation();
        currentIdx = i;
        maybeChangePhase(i);
        updateMap(i);
      });
    m.bindPopup(`
      <div class="popup-year">${formatDate(loc.start)}</div>
      <div class="popup-place">${loc.label}</div>
      ${loc.address && loc.address !== loc.label ? `<div class="popup-addr">${loc.address}</div>` : ''}
    `);
    markers.push(m);
  });

  for (let k = 0; k < TAIL_LENGTH; k++) {
    tailSegments.push(L.polyline([], { color: TAIL_COLOR, weight: 2.2, opacity: 0 }).addTo(map));
  }
}

function step() {
  if (currentIdx < LOCATIONS.length - 1) {
    currentIdx++;
    maybeChangePhase(currentIdx);
    updateMap(currentIdx);
    animTimer = setTimeout(step, getSpeedMs());
  } else {
    playing = false;
    document.getElementById('btn-play').classList.remove('active');
    document.getElementById('btn-pause').classList.remove('active');
  }
}

function startAnimation() {
  if (animTimer) clearTimeout(animTimer);
  playing = true;
  document.getElementById('btn-play').classList.add('active');
  document.getElementById('btn-pause').classList.remove('active');
  animTimer = setTimeout(step, getSpeedMs());
}

function stopAnimation() {
  if (animTimer) clearTimeout(animTimer);
  playing = false;
  document.getElementById('btn-play').classList.remove('active');
  document.getElementById('btn-pause').classList.add('active');
}

document.getElementById('btn-play').addEventListener('click', () => {
  if (currentIdx >= LOCATIONS.length - 1) { currentIdx = 0; currentPhase = LOCATIONS[0].phase; map.flyToBounds(PHASE_BOUNDS[1], { padding: [30,30], duration: 1.5 }); updateMap(0); }
  startAnimation();
});
document.getElementById('btn-pause').addEventListener('click', stopAnimation);
document.getElementById('btn-reset').addEventListener('click', () => {
  stopAnimation();
  currentIdx = 0;
  currentPhase = LOCATIONS[0].phase;
  map.flyToBounds(PHASE_BOUNDS[1], { padding: [30, 30], duration: 1.5 });
  updateMap(0);
  markers.forEach((m, i) => { if (i > 0) m.setOpacity(0); });
});
document.getElementById('timeline').addEventListener('input', function() {
  stopAnimation();
  currentIdx = parseInt(this.value);
  maybeChangePhase(currentIdx);
  updateMap(currentIdx);
});
document.getElementById('btn-trail').addEventListener('click', function() {
  showTrail = !showTrail;
  this.textContent = `Vis spor: ${showTrail ? 'På' : 'Av'}`;
  this.classList.toggle('active', showTrail);
  updateTail(currentIdx);
});

initMarkers();
updateMap(0);
setTimeout(startAnimation, 800);
</script>
