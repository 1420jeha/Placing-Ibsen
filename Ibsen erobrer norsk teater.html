at": 68.79943, "lon": 16.53873, "firstYear": 2024, "years": [2024], "count": 1}, {"name": "Teater Innlandet", "lat": 60.79583, "lon": 11.06691, "firstYear": 2024, "years": [2024], "count": 1}, {"name": "Haugesund Teater", "lat": 59.41412, "lon": 5.26545, "firstYear": 2025, "years": [2025], "count": 1}, {"name": "Sjøholmen Kulturhus", "lat": 59.89204, "lon": 10.54177, "firstYear": 2025, "years": [2025], "count": 1}, {"name": "Teaterlåven", "lat": 60.78637, "lon": 5.00828, "firstYear": 2025, "years": [2025], "count": 1}, {"name": "Tivoli", "lat": 60.38978, "lon": 5.32176, "firstYear": 2025, "years": [2025, 2025], "count": 2}, {"name": "Oslo ByMuseum", "lat": 59.92392, "lon": 10.70301, "firstYear": 2026, "years": [2026], "count": 1}];
const YEAR_START = 1850, YEAR_END = 2026;
const TOTAL_YEARS = YEAR_END - YEAR_START + 1;

// Precompute per-venue year lookup, cumulative totals, and per-year "newly conquered" lists.
VENUES.forEach(v => { v.yearSet = new Set(v.years); });

const NEW_BY_YEAR = {};      // year -> [venue, ...] whose firstYear === year
const EVENTS_BY_YEAR = {};   // year -> event count that year
for (let y = YEAR_START; y <= YEAR_END; y++) { NEW_BY_YEAR[y] = []; EVENTS_BY_YEAR[y] = 0; }
VENUES.forEach(v => {
  NEW_BY_YEAR[v.firstYear].push(v);
  v.years.forEach(y => { EVENTS_BY_YEAR[y] = (EVENTS_BY_YEAR[y] || 0) + 1; });
});

const CUM_VENUES = new Array(TOTAL_YEARS);
const CUM_EVENTS = new Array(TOTAL_YEARS);
let runningV = 0, runningE = 0;
for (let i = 0; i < TOTAL_YEARS; i++) {
  const y = YEAR_START + i;
  runningV += NEW_BY_YEAR[y].length;
  runningE += EVENTS_BY_YEAR[y];
  CUM_VENUES[i] = runningV;
  CUM_EVENTS[i] = runningE;
}

const bounds = L.latLngBounds(
  VENUES.filter(v => v.lat < 72).map(v => [v.lat, v.lon])
);

const map = L.map('map', { zoomControl: true, attributionControl: true, scrollWheelZoom: true });
map.fitBounds(bounds, { padding: [24, 24] });

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap',
  maxZoom: 18
}).addTo(map);

function radiusFor(count) {
  return 1.5 + Math.min(4.5, Math.sqrt(count) * 0.6);
}

function styleFor(state, count) {
  const r = radiusFor(count);
  if (state === 'active') {
    return { radius: r + 1.2, color: '#1a1206', weight: 1.5, fillColor: '#ffdd8f', fillOpacity: 1,
      className: 'v-active' };
  }
  if (state === 'conquered') {
    return { radius: r, color: '#1a1206', weight: 1, fillColor: '#e0b878', fillOpacity: 0.92,
      className: 'v-conquered' };
  }
  return { radius: r, color: 'transparent', weight: 0, fillColor: '#000', fillOpacity: 0, className: 'v-future' };
}

const markers = VENUES.map(v => {
  const m = L.circleMarker([v.lat, v.lon], styleFor('future', v.count));
  m.setStyle({ opacity: 0, fillOpacity: 0 });
  m.addTo(map);
  m.bindPopup(`
    <div class="popup-place">${v.name}</div>
    <div class="popup-line">F&oslash;rste forestilling: ${v.firstYear}</div>
    <div class="popup-line">${v.count} forestilling${v.count === 1 ? '' : 'er'} i alt (${v.years[0]}&ndash;${v.years[v.years.length-1]})</div>
  `);
  return m;
});
const markerState = VENUES.map(() => 'future');

let currentIdx = 0;
let playing = true;
let animTimer = null;

function getSpeedMs() {
  const v = parseInt(document.getElementById('speed').value);
  return Math.round(2045 / v); // default slider (4) plays all 177 years in ~90s
}

function updateMap(idx) {
  const year = YEAR_START + idx;

  VENUES.forEach((v, i) => {
    let state;
    if (v.firstYear > year) state = 'future';
    else if (v.yearSet.has(year)) state = 'active';
    else state = 'conquered';

    if (state !== markerState[i]) {
      const s = styleFor(state, v.count);
      const m = markers[i];
      if (state === 'future') {
        m.setStyle(Object.assign({}, s, { opacity: 0, fillOpacity: 0 }));
      } else if (state === 'active') {
        m.setStyle(Object.assign({}, s, { opacity: 1, fillOpacity: 1 }));
        m.bringToFront();
      } else {
        m.setStyle(Object.assign({}, s, { opacity: 1 }));
      }
      markerState[i] = state;
    }
  });

  document.getElementById('year-num').textContent = year;
  document.getElementById('year-badge').style.display = (year === 2006) ? 'inline-block' : 'none';
  document.getElementById('stat-venues').textContent = CUM_VENUES[idx];
  document.getElementById('stat-events').textContent = CUM_EVENTS[idx];
  document.getElementById('timeline').value = idx;
  document.getElementById('counter').textContent = `År ${year} · ${idx + 1} av ${TOTAL_YEARS}`;

  const panel = document.getElementById('info-content');
  const fresh = NEW_BY_YEAR[year];
  if (fresh.length === 0) {
    panel.innerHTML = `<div class="info-empty">Ingen nye scener &mdash; ${EVENTS_BY_YEAR[year] || 0} forestilling${EVENTS_BY_YEAR[year] === 1 ? '' : 'er'} p&aring; etablerte scener.</div>`;
  } else {
    const shown = fresh.slice(0, 8);
    let html = shown.map(v => `<div class="info-entry"><div class="info-place">${v.name}</div></div>`).join('');
    if (fresh.length > shown.length) {
      html += `<div class="info-more">+ ${fresh.length - shown.length} andre nye scener</div>`;
    }
    panel.innerHTML = html;
  }
}

function step() {
  if (currentIdx < TOTAL_YEARS - 1) {
    currentIdx++;
    updateMap(currentIdx);
    animTimer = setTimeout(step, getSpeedMs());
  } else {
    playing = false;
    document.getElementById('btn-play').classList.remove('active');
    document.getElementById('btn-pause').classList.remove('active');
  }
}

function startAnimation() {
  if (animTimer) clearTimeout(animTimer);
  playing = true;
  document.getElementById('btn-play').classList.add('active');
  document.getElementById('btn-pause').classList.remove('active');
  animTimer = setTimeout(step, getSpeedMs());
}

function stopAnimation() {
  if (animTimer) clearTimeout(animTimer);
  playing = false;
  document.getElementById('btn-play').classList.remove('active');
  document.getElementById('btn-pause').classList.add('active');
}

document.getElementById('btn-play').addEventListener('click', () => {
  if (currentIdx >= TOTAL_YEARS - 1) { currentIdx = 0; updateMap(0); }
  startAnimation();
});
document.getElementById('btn-pause').addEventListener('click', stopAnimation);
document.getElementById('btn-reset').addEventListener('click', () => {
  stopAnimation();
  currentIdx = 0;
  updateMap(0);
});
document.getElementById('timeline').addEventListener('input', function() {
  stopAnimation();
  currentIdx = parseInt(this.value);
  updateMap(currentIdx);
});

updateMap(0);
setTimeout(startAnimation, 800);
</script>
