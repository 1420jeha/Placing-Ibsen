// ── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); redrawStatic(); });

// ── Map projection ────────────────────────────────────────────────────────────
// Natural earth projection (approximate)
function toRad(d) { return d * Math.PI / 180; }

const LAT_MAX = 83, LAT_MIN = -58;

function project(lon, lat) {
  const W = canvas.width, H = canvas.height;
  const mX = W * 0.04, mTop = H * 0.13, mBot = H * 0.12;
  const mW = W - mX*2, mH = H - mTop - mBot;

  // Equirectangular, clipped to LAT_MIN..LAT_MAX
  const x = mX + ((lon + 180) / 360) * mW;
  const y = mTop + ((LAT_MAX - lat) / (LAT_MAX - LAT_MIN)) * mH;
  return [x, y];
}

// ── Draw land ─────────────────────────────────────────────────────────────────
let landImageData = null;

function drawLandToCanvas() {
  // Ocean
  ctx.fillStyle = '#091929';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Subtle graticule
  ctx.strokeStyle = 'rgba(255,255,255,0.035)';
  ctx.lineWidth = 0.5;
  for (let lon = -180; lon <= 180; lon += 30) {
    ctx.beginPath();
    const [x, y0] = project(lon, 90);
    const [, y1]  = project(lon, -90);
    ctx.moveTo(x, y0); ctx.lineTo(x, y1);
    ctx.stroke();
  }
  for (let lat = -60; lat <= 90; lat += 30) {
    ctx.beginPath();
    const [x0, y] = project(-180, lat);
    const [x1]    = project(180, lat);
    ctx.moveTo(x0, y); ctx.lineTo(x1, y);
    ctx.stroke();
  }

  // Land polygons
  ctx.fillStyle = '#2e2010';
  ctx.strokeStyle = 'rgba(210,185,130,0.6)';
  ctx.lineWidth = 0.6;

  for (const polygon of LAND) {
    // Skip Antarctica polygons (all points below LAT_MIN)
    const outerRing = polygon[0];
    const maxLat = Math.max(...outerRing.map(p => p[1]));
    if (maxLat < LAT_MIN) continue;

    for (let ri = 0; ri < polygon.length; ri++) {
      const ring = polygon[ri];
      ctx.beginPath();
      let penDown = false;
      for (let i = 0; i < ring.length; i++) {
        const [lon, lat] = ring[i];
        const [x, y] = project(lon, lat);
        if (!penDown) {
          ctx.moveTo(x, y);
          penDown = true;
        } else {
          // Detect antimeridian crossing: lon jump > 180°
          const prevLon = ring[i - 1][0];
          if (Math.abs(lon - prevLon) > 180) {
            // Lift pen and start new subpath to avoid cross-map line
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }
      }
      ctx.closePath();
      if (ri === 0) ctx.fill();
      ctx.stroke();
    }
  }

  // Caspian Sea: stored as inner ring of polygon 90, draw it in ocean colour
  const caspianRing = LAND[90][1];
  ctx.beginPath();
  for (let i = 0; i < caspianRing.length; i++) {
    const [lon, lat] = caspianRing[i];
    const [x, y] = project(lon, lat);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = '#091929';
  ctx.fill();
  ctx.strokeStyle = 'rgba(210,185,130,0.25)';
  ctx.lineWidth = 0.5;
  ctx.stroke();
}

function redrawStatic() {
  drawLandToCanvas();
  // Capture snapshot for fast reuse
  landImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
}

// ── Animation data ─────────────────────────────────────────────────────────────
const START_YEAR = 1850, END_YEAR = 2026, DURATION_MS = 90000;

// Pre-sort all dots
const allDots = [];
for (let y = START_YEAR; y <= END_YEAR; y++) {
  const pts = DATA_BY_YEAR[y] || [];
  for (const [lat, lon] of pts) allDots.push([y, lat, lon]);
}
allDots.sort((a, b) => a[0] - b[0]);
const totalDots = allDots.length;

// Cumulative counts per year for fast lookup
const cumByYear = {};
let cum = 0;
for (let y = START_YEAR; y <= END_YEAR; y++) {
  cum += (DATA_BY_YEAR[y] || []).length;
  cumByYear[y] = cum;
}

// ── Animation state ────────────────────────────────────────────────────────────
let startTime = null, paused = false, pauseOffset = 0, pauseAt = 0;
let rafId = null;
let lastDotIdx = 0; // index up to which we've drawn in current animation pass
let dotCanvas = null; // offscreen canvas for accumulated dots

function initDotCanvas() {
  dotCanvas = document.createElement('canvas');
  dotCanvas.width  = canvas.width;
  dotCanvas.height = canvas.height;
}

function getT(timestamp) {
  return Math.min((timestamp - startTime - pauseOffset) / DURATION_MS, 1);
}

function frame(timestamp) {
  if (!startTime) startTime = timestamp;
  if (paused) return;
  const t = getT(timestamp);
  const currentYear = START_YEAR + t * (END_YEAR - START_YEAR);
  render(currentYear, t);
  if (t < 1) rafId = requestAnimationFrame(frame);
  else {
    document.getElementById('play-btn').textContent = '↺ FERDIG';
  }
}

function render(currentYear, t) {
  // Restore static land
  if (landImageData) ctx.putImageData(landImageData, 0, 0);
  else drawLandToCanvas();

  // Draw accumulated dots
  const dCtx = dotCanvas.getContext('2d');

  // Add newly visible dots to dotCanvas
  while (lastDotIdx < totalDots && allDots[lastDotIdx][0] <= currentYear) {
    const [, lat, lon] = allDots[lastDotIdx];
    const [x, y] = project(lon, lat);
    // Draw permanent dim dot on accumulator canvas
    dCtx.beginPath();
    dCtx.arc(x, y, 2, 0, Math.PI*2);
    dCtx.fillStyle = 'rgba(160,90,30,0.45)';
    dCtx.fill();
    lastDotIdx++;
  }

  // Composite accumulated dots
  ctx.drawImage(dotCanvas, 0, 0);

  // Draw glowing "recent" dots (last ~3 years window)
  const glowWindow = Math.max(2, (END_YEAR - START_YEAR) * 0.018);
  for (let i = lastDotIdx - 1; i >= 0 && allDots[i][0] >= currentYear - glowWindow; i--) {
    const [dotYear, lat, lon] = allDots[i];
    const age = (currentYear - dotYear) / glowWindow; // 0=new, 1=fading
    const [x, y] = project(lon, lat);
    const alpha = Math.max(0, 1 - age);

    // Outer glow
    const g = ctx.createRadialGradient(x, y, 0, x, y, 10);
    g.addColorStop(0, `rgba(255,210,80,${alpha*0.7})`);
    g.addColorStop(1, `rgba(200,120,20,0)`);
    ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI*2);
    ctx.fillStyle = g; ctx.fill();

    // Bright core
    ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,230,130,${alpha*0.95})`;
    ctx.fill();
  }

  // UI updates
  const dispYear = Math.round(currentYear);
  document.getElementById('year').textContent = dispYear;
  document.getElementById('this-year').textContent = ((DATA_BY_YEAR[dispYear]||[]).length).toLocaleString('no');
  document.getElementById('total').textContent = (cumByYear[dispYear]||0).toLocaleString('no');
  document.getElementById('bar-fill').style.width = (t*100)+'%';
}

// ── Controls ───────────────────────────────────────────────────────────────────
function startAnimation() {
  startTime = null; pauseOffset = 0; paused = false;
  lastDotIdx = 0;
  initDotCanvas();
  redrawStatic();
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(ts => { startTime = ts; frame(ts); });
}

document.getElementById('start-btn').addEventListener('click', () => {
  const ov = document.getElementById('intro');
  ov.style.opacity = '0';
  setTimeout(() => ov.style.display='none', 1200);
  startAnimation();
});

document.getElementById('play-btn').addEventListener('click', () => {
  const btn = document.getElementById('play-btn');
  if (btn.textContent.includes('FERDIG')) { startAnimation(); btn.textContent='⏸ PAUSE'; return; }
  paused = !paused;
  if (paused) {
    pauseAt = performance.now();
    btn.textContent = '▶ SPILL AV';
  } else {
    pauseOffset += performance.now() - pauseAt;
    btn.textContent = '⏸ PAUSE';
    rafId = requestAnimationFrame(frame);
  }
});

document.getElementById('restart-btn').addEventListener('click', () => {
  startAnimation();
  document.getElementById('play-btn').textContent = '⏸ PAUSE';
});

// Initial static draw
redrawStatic();
</script>
</body>
</html>
